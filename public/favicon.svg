<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140f35" stop-opacity="1" />
      <stop offset="100%" stop-color="#040714" stop-opacity="1" />
    </radialGradient>

    <!-- Outer Arc Energy Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>

    <!-- Inner Shield / Lock Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050515" />
      <stop offset="50%" stop-color="#120c38" />
      <stop offset="100%" stop-color="#1c1152" />
    </linearGradient>

    <!-- Glowing Cyan Accent -->
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Emerald Pact Settlement Spark -->
    <linearGradient id="emeraldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Outer Shadow Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Icon Base (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Outer Luminous Orbital Arc Ring -->
  <path
    d="M 120 256 A 136 136 0 1 1 392 256 A 136 136 0 0 1 120 256"
    stroke="url(#arcGrad)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-dasharray="620 180"
    filter="url(#neonGlow)"
  />

  <!-- Secondary Dynamic Arc Ring (Intersecting Vector) -->
  <path
    d="M 140 180 C 180 110, 332 110, 372 180 C 400 230, 390 320, 340 370 C 290 420, 200 410, 160 360"
    stroke="url(#cyanSpark)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-dasharray="400 120"
    opacity="0.85"
  />

  <!-- Central Autonomous Pact Hexa-Shield -->
  <polygon
    points="256,128 360,188 360,308 256,368 152,308 152,188"
    fill="url(#coreGrad)"
    stroke="url(#arcGrad)"
    stroke-width="8"
  />

  <!-- Inner Cryptographic Vault Seal -->
  <polygon
    points="256,168 326,208 326,288 256,328 186,288 186,208"
    fill="#08061a"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="3"
  />

  <!-- Stylized "P" & "A" (ArcPact Monogram Core) -->
  <!-- Arc Upper Loop -->
  <path
    d="M 230 200 L 270 200 C 295 200, 305 212, 305 228 C 305 244, 295 256, 270 256 L 244 256 L 244 300"
    stroke="url(#cyanSpark)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#coreGlow)"
  />

  <!-- Diagonal Escrow Settlement Slash -->
  <line
    x1="262" y1="256"
    x2="298" y2="300"
    stroke="url(#emeraldSpark)"
    stroke-width="14"
    stroke-linecap="round"
    filter="url(#coreGlow)"
  />

  <!-- Autonomous Telemetry Beacon Sparkles -->
  <circle cx="392" cy="256" r="10" fill="#00F0FF" filter="url(#coreGlow)" />
  <circle cx="120" cy="256" r="8" fill="#FF0080" filter="url(#coreGlow)" />
  <circle cx="256" cy="128" r="7" fill="#34D399" filter="url(#coreGlow)" />
</svg>
