<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Solid Pure Obsidian Squircle (No gradients, no blur, 100% flat vector) -->
  <rect width="512" height="512" rx="120" fill="#070A12" />

  <!-- The Interlocking Arc Pact: Solid Client (Blue) & Agent (White) Agreement -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Bottom Under-Pass Segment of Blue Ring -->
    <path
      d="M 170 300 C 130 260, 130 196, 170 156 C 210 116, 274 116, 314 156"
      stroke="#0052FF"
      stroke-width="44"
    />

    <!-- White Ring (Continuous Arc) -->
    <path
      d="M 342 156 C 382 196, 382 260, 342 300 C 302 340, 238 340, 198 300 C 182 284, 174 266, 172 248"
      stroke="#FFFFFF"
      stroke-width="44"
    />

    <!-- Top Over-Pass Segment of Blue Ring -->
    <path
      d="M 314 156 C 322 164, 328 174, 332 186"
      stroke="#0052FF"
      stroke-width="44"
    />
    <path
      d="M 170 300 C 210 340, 274 340, 314 300"
      stroke="#0052FF"
      stroke-width="44"
    />

    <!-- Central Escrow Settlement Node (Solid Flat Emerald Dot) -->
    <circle cx="256" cy="228" r="16" fill="#00D26A" />
  </g>
</svg>
