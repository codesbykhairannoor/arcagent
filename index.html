<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('arcagent_theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.className = theme;
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.className = 'dark';
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="generator" content="Arc Studio by Circle — https://studio.arc.io" />
    <title>ArcAgent Escrow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <!-- Built with Arc Studio — https://studio.arc.io -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
