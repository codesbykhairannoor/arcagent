<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('arcagent_theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.className = theme;
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.className = 'dark';
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="generator" content="Arc Studio by Circle (https://studio.arc.io)" />
    <meta name="description" content="ArcPact is an autonomous micro-escrow and milestone payout platform on Arc Network. Trustless settlement with native USDC, cryptographic SHA-256 deliverable proofs, and software-to-software agent payments." />
